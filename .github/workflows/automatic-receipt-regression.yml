name: Verified payment automatic receipt regression
on:
  push:
    branches: [main, feature/verified-payment-auto-receipts-20261111]
    paths:
      - app.py
      - automatic_verified_receipts.py
      - gunicorn.conf.py
      - tests/test_automatic_verified_receipts.py
      - tests/test_launch_contact.py
      - .github/workflows/automatic-receipt-regression.yml
  pull_request:
    branches: [main]
    paths:
      - app.py
      - automatic_verified_receipts.py
      - gunicorn.conf.py
      - tests/test_automatic_verified_receipts.py
      - tests/test_launch_contact.py
      - .github/workflows/automatic-receipt-regression.yml
permissions: {contents: read}
jobs:
  paid-receipt-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install offline test dependencies
        run: python -m pip install "Flask>=3,<4"
      - name: Compile safe startup and receipt module
        run: python -m py_compile app.py automatic_verified_receipts.py gunicorn.conf.py
      - name: Test ledger-only payment trigger, idempotency and WhatsApp window
        run: python -m unittest discover -s tests -p 'test_automatic_verified_receipts.py' -v
      - name: Test existing human, eligibility and safe CRM behavior
        run: |
          python -m unittest discover -s tests -p 'test_business_handover_whatsapp_alerts.py' -v
          python -m unittest discover -s tests -p 'test_scholarship_eligibility_workflow.py' -v
          python -m unittest discover -s tests -p 'test_launch_contact.py' -v
      - name: Formatting and whitespace
        run: git diff --check
