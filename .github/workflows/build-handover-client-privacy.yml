name: Validate private business-only handover acknowledgement
on:
  push:
    branches: [fix/customer-handover-privacy-20261111]
    paths: [tools/remove_personal_handover_contact.py, tests/test_business_handover_whatsapp_alerts.py, .github/workflows/build-handover-client-privacy.yml]
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/remove_personal_handover_contact.py
      - run: python -m pip install "Flask>=3,<4"
      - name: Verify original human handover and business notification routes
        run: |
          python -m py_compile app.py
          python -m unittest discover -s tests -p 'test_business_handover_whatsapp_alerts.py' -v
          python -m unittest discover -s tests -p 'test_zero_handover.py' -v
          python -m unittest discover -s tests -p 'test_customer_resume.py' -v
          git diff --check
      - name: Commit only validated app.py source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          if ! git diff --cached --quiet; then
            git commit -m 'Keep Jones human takeover replies in IBROWS business chat'
            git push origin HEAD:fix/customer-handover-privacy-20261111
          fi
