name: Generate verified V133 source
on:
  push:
    branches:
      - feature/v133-responsive-media
    paths:
      - 'tools/apply_v133.py'
      - '.github/workflows/v133-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply exact-SHA V133 patch
        run: python tools/apply_v133.py
      - name: Commit verified app.py
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          if git diff --cached --quiet; then
            echo 'Already V133'
            exit 0
          fi
          git commit -m 'Generate verified V133 responsive media and mobile menu'
          git push origin HEAD:feature/v133-responsive-media
