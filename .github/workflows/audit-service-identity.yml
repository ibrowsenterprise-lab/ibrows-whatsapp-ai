name: Inspect service naming for one-off eligibility
on:
  push:
    branches: [audit/service-identity-readonly-20261111]
    paths: [tools/audit_service_identity.py,.github/workflows/audit-service-identity.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/audit_service_identity.py
