name: MSJ V143 mobile page integration
on:
  push:
    branches: [feature/msj-mobile-order-layout-v143]
    paths: ["tools/msj_v143_patch.py",".github/workflows/msj-v143-build.yml"]
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply V143 improvements
        run: python tools/msj_v143_patch.py
      - name: Verify Python source and site regressions
        run: |
          python -m py_compile msj_store.py app.py
          python -m pip install -r requirements.txt "pypdf>=5,<7"
          python tools/test_msj_store.py
          python tools/test_msj_image_import.py
          python tools/test_msj_bulk_publish.py
          python tools/test_msj_catalogue_repair.py
      - name: Store modified page for review
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add msj_store.py
          if ! git diff --cached --quiet; then
            git commit -m "V143 compact MSJ order layout and dynamic estimated subtotal"
            git push origin HEAD:feature/msj-mobile-order-layout-v143
          fi
