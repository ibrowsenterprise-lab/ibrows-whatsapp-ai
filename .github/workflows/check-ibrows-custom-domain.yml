name: Read-only IBROWS custom-domain verification
on:
  push:
    branches:
      - feature/check-ibrows-custom-domain-20261009
    paths:
      - '.github/workflows/check-ibrows-custom-domain.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect DNS TLS redirects and production markers without submitting forms
        run: |
          python - <<'PY'
          import socket, ssl, urllib.request, urllib.error, json
          hosts = ["ibrowsenterprise.com","www.ibrowsenterprise.com","ibrows-whatsapp-ai-1.onrender.com"]
          paths = ["/","/team","/project-discovery","/company-profile.pdf"]
          for host in hosts:
              print("DOMAIN",host,flush=True)
              try:
                  ips=sorted({a[4][0] for a in socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)})
                  print("DNS_OK",json.dumps(ips),flush=True)
              except Exception as e:
                  print("DNS_ERROR",type(e).__name__,str(e)[:250],flush=True)
              for path in paths:
                  url="https://"+host+path
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"IBROWS-ReadOnly-Verification/1.0"})
                      with urllib.request.urlopen(req,timeout=12) as r:
                          data=r.read(1200000)
                          detail={"url":url,"final_url":r.url,"status":r.status,
                              "content_type":r.headers.get("Content-Type",""),
                              "length_sample":len(data),"v138_marker":b"Start a Project" in data,
                              "readmalawi":b"ReadMalawi" in data,
                              "fatuma":b"Fatuma Nyirenda" in data,
                              "pdf_magic":data.startswith(b"%PDF-")}
                          print("RESULT",json.dumps(detail),flush=True)
                  except Exception as e:
                      print("HTTP_ERROR",json.dumps({"url":url,"type":type(e).__name__,"error":str(e)[:230]}),flush=True)
          PY
