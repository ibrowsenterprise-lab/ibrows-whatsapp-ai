name: Static review of paid eligibility WhatsApp routing
on:
  push:
    branches: [fix/verified-eligibility-intake-20261111]
    paths: [tools/audit_eligibility_routing.py,.github/workflows/audit-eligibility-routing.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/audit_eligibility_routing.py
