name: Build and regression-test WhatsApp zero handover fix
on:
  push:
    branches: [fix/whatsapp-zero-handover-20261110]
    paths:
      - tools/apply_zero_handover.py
      - tests/test_zero_handover.py
      - .github/workflows/build-zero-handover.yml
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch only human-handover menu selector
        run: python tools/apply_zero_handover.py
      - name: Syntax, diffs and offline zero-handover regression tests
        run: |
          python -m py_compile app.py
          python -m unittest discover -s tests -p 'test_zero_handover.py' -v
          git diff --check
          git diff --stat
      - name: Commit audited app to review branch after checks pass
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          if ! git diff --cached --quiet; then
            git commit -m 'Make standalone WhatsApp 0 activate existing Jones handover'
            git push origin HEAD:fix/whatsapp-zero-handover-20261110
          fi
