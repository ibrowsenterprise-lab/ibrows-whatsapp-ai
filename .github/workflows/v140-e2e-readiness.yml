name: V140 E2E readiness source check
on:
  push:
    branches: [feature/v140-safe-e2e-readiness-20261010]
    paths: ['tools/e2e_readiness_v140.py','.github/workflows/v140-e2e-readiness.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source and print read-only E2E preconditions
        run: |
          python -m py_compile app.py
          python tools/e2e_readiness_v140.py
