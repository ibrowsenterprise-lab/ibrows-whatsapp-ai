name: IBROWS V138 integration audit
on:
  push:
    branches:
      - feature/ibrows-final-integration-audit-20261009
    paths:
      - tools/audit_v138_integration.py
      - app.py
      - .github/workflows/v138-integration-audit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only audit dependencies
        run: python -m pip install 'pypdf>=5,<7' 'Jinja2>=3.1,<4' 'PyMuPDF>=1.25,<2' 'Pillow>=10.4,<13'
      - name: Validate production app syntax
        run: |
          python -m py_compile app.py
          python -m compileall -q tools
      - name: Run existing integration regression suite
        run: |
          python tools/test_v132.py
          node --check /tmp/ibrows-v132-admin.js
          python tools/test_v134_business_email.py
          python tools/test_v135_typography.py
          python tools/test_v136_team.py
          python tools/test_v137_readmalawi.py
      - name: Inspect public routes team photos and company profile PDF
        run: python tools/audit_v138_integration.py
      - name: Commit public audit snapshot to the branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/reports/v138-integration-audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record V138 IBROWS website integration audit'
            git push origin HEAD:feature/ibrows-final-integration-audit-20261009
          fi
