name: Build and test paid scholarship intake workflow
on:
  push:
    branches: [fix/verified-eligibility-intake-20261111]
    paths:
      - scholarship_eligibility_intake.py
      - scholarship_eligibility_backend.py
      - crm_paid_truth.py
      - gunicorn.conf.py
      - tests/test_launch_contact.py
      - tests/test_scholarship_eligibility_workflow.py
      - tools/apply_eligibility_webhook.py
      - .github/workflows/paid-eligibility-intake.yml
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Add exact customer-start paid eligibility command to webhook
        run: python tools/apply_eligibility_webhook.py
      - name: Install only isolated test dependencies
        run: python -m pip install "Flask>=3,<4"
      - name: Compile and run real webhook handler in mocked offline tests
        run: |
          python -m py_compile app.py scholarship_eligibility_intake.py scholarship_eligibility_backend.py crm_paid_truth.py gunicorn.conf.py
          python -m unittest discover -s tests -p 'test_scholarship_eligibility_workflow.py' -v
          python -m unittest discover -s tests -p 'test_customer_resume.py' -v
          python -m unittest discover -s tests -p 'test_crm_paid_truth.py' -v
          git diff --check
          git diff --stat
      - name: Commit only validated production webhook change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          if ! git diff --cached --quiet; then
            git commit -m 'Allow verified one-off scholarship customers to start eligibility intake'
            git push origin HEAD:fix/verified-eligibility-intake-20261111
          fi
