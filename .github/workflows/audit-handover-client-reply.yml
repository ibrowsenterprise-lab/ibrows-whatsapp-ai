name: Read handover client response source
on:
  push:
    branches: [fix/customer-handover-privacy-20261111]
    paths: [tools/audit_handover_client_reply.py,.github/workflows/audit-handover-client-reply.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/audit_handover_client_reply.py
