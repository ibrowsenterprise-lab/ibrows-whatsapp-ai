name: IBROWS read-only WhatsApp lead flow inventory
on:
  push:
    branches: [audit/whatsapp-leads-readonly-20261110]
    paths:
      - tools/inspect_whatsapp_leads.py
      - .github/workflows/ibrows-whatsapp-lead-inventory.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/inspect_whatsapp_leads.py
      - name: Audit public pages, customer forms and admin access (GET only)
        run: python tools/audit_v151_public.py
