name: V140 public enquiry package preflight
on:
  push:
    branches: [feature/v140-safe-e2e-readiness-20261010]
    paths: ['tools/preflight_v140_enquiry.py','.github/workflows/v140-package-preflight.yml']
permissions: {contents: read}
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect only HTML form field names across general enquiries
        run: python tools/preflight_v140_enquiry.py
