name: Inspect zero-command WhatsApp handover source safely
on:
  push:
    branches: [fix/whatsapp-zero-handover-20261110]
    paths:
      - tools/inspect_zero_handover.py
      - .github/workflows/inspect-zero-handover.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read static code without app imports or user data
        run: python tools/inspect_zero_handover.py
