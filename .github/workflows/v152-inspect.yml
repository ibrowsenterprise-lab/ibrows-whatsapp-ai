name: V152 inspect media upload implementation
on:
  push:
    branches: [feature/media-video-compression-v152]
    paths: [tools/inspect_v152_media.py, .github/workflows/v152-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect bounded source excerpts
        run: python tools/inspect_v152_media.py
