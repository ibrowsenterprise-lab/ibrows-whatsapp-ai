name: V139 IBROWS client journey audit
on:
  push:
    branches: [feature/v139-customer-journey-audit-20261010]
    paths:
      - 'tools/audit_v139_client_journey.py'
      - '.github/workflows/v139-client-journey-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analyze routes templates form inputs and response handling without importing production app
        run: python tools/audit_v139_client_journey.py
      - name: Commit structural findings for review
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/reports/v139-journey.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record V139 read-only customer journey findings'
            git push origin HEAD:feature/v139-customer-journey-audit-20261010
          fi
