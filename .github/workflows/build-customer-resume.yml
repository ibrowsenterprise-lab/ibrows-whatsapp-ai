name: Build customer WhatsApp AI resume fix
on:
  push:
    branches: [fix/customer-resume-ai-20261110]
    paths:
      - tools/apply_customer_resume.py
      - tests/test_customer_resume.py
      - .github/workflows/build-customer-resume.yml
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Patch only webhook resume command and human handover instructions
        run: python tools/apply_customer_resume.py
      - name: Compile and run offline message simulations
        run: |
          python -m py_compile app.py
          python -m unittest discover -s tests -p 'test_customer_resume.py' -v
          python -m unittest discover -s tests -p 'test_zero_handover.py' -v
          git diff --check
          git diff --stat
      - name: Commit only tested production application patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          if ! git diff --cached --quiet; then
            git commit -m 'Let customers resume paused WhatsApp AI by explicit command'
            git push origin HEAD:fix/customer-resume-ai-20261110
          fi
