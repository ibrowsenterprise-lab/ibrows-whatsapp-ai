name: IBROWS Python and security regression checks
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposal
        uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: |
          python -m py_compile app.py
          python -m compileall -q tools
      - name: Check essential IBROWS safeguards
        run: |
          grep -q 'SESSION_COOKIE_HTTPONLY=True' app.py
          grep -q 'def validate_csrf()' app.py
          grep -q 'WEB_GALLERY_ADMIN_PREVIEW_MAX_SIDE = 640' app.py
          grep -q 'Pillow>=10.4,<13' requirements.txt
      - name: Run V132 client privacy and mobile checks
        if: hashFiles('tools/test_v132.py') != ''
        run: |
          python tools/test_v132.py
          node --check /tmp/ibrows-v132-admin.js
      - name: Test V134 Business Email & Domain Setup form and enquiry flow
        run: |
          python -m pip install 'Jinja2>=3.1,<4'
          python tools/test_v134_business_email.py
      - name: Audit unified typography across web and app templates
        run: python tools/test_v135_typography.py
      - name: Verify Fatuma staff profile, photograph and prior roster
        run: python tools/test_v136_team.py
