name: IBROWS post-upgrade live site audit 21 October
on:
  push:
    branches: [audit/ibrows-20261021-postupgrade]
    paths: [.github/workflows/ibrows-postupgrade-audit-20261021.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check 31 pages, enquiry forms, MSJ and admin access
        run: python tools/audit_daily_20261020.py
