name: IBROWS private customer CRM quality and payment safety
on:
  pull_request:
    branches: [main]
    paths:
      - crm_quality.py
      - gunicorn.conf.py
      - tests/test_crm_quality.py
      - .github/workflows/crm-quality.yml
  push:
    branches: [main, fix/crm-truthful-payment-mobile-20261110]
    paths:
      - crm_quality.py
      - gunicorn.conf.py
      - tests/test_crm_quality.py
      - .github/workflows/crm-quality.yml
permissions:
  contents: read
jobs:
  crm-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only test dependencies (never app or production DB)
        run: python -m pip install "Flask>=3,<4"
      - name: Check syntax, escaping, administrative guard and safe ledger workflow
        run: |
          python -m py_compile crm_quality.py gunicorn.conf.py tests/test_crm_quality.py
          python -m unittest discover -s tests -p "test_crm_quality.py" -v
      - name: Re-run existing WhatsApp and public launch behavior tests
        run: |
          python -m unittest discover -s tests -p "test_public_ai_shortcut.py" -v
          python -m unittest discover -s tests -p "test_launch_contact.py" -v
          python -m unittest discover -s tests -p "test_customer_resume.py" -v
          python -m unittest discover -s tests -p "test_zero_handover.py" -v
