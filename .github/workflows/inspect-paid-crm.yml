name: Inspect paid CRM dashboard source read only
on:
  push:
    branches: [fix/crm-paid-workflow-truth-20261111]
    paths: [tools/inspect_paid_crm.py, .github/workflows/inspect-paid-crm.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/inspect_paid_crm.py
