name: Agriculture photo upload checks
on:
  pull_request:
    paths:
      - 'agro_marketplace.py'
      - 'agro_marketplace_ui.py'
      - 'agro_photo_*.py'
      - 'tests/test_agro_photo_*.py'
      - 'migrations/proposed_agro_produce_photos.sql'
      - '.github/workflows/agro-photo-checks.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q agro_marketplace.py agro_marketplace_ui.py agro_photo_validation.py agro_photo_persistence.py
      - run: python -m unittest discover -s tests -p 'test_agro_photo_*.py' -v
