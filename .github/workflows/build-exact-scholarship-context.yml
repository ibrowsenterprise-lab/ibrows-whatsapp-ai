name: Repair exact scholarship service payment context and test
on:
  push:
    branches: [fix/eligibility-verified-context-20261111]
    paths:
      - scholarship_payment_context.py
      - tests/test_exact_scholarship_payment_context.py
      - tools/apply_exact_scholarship_context.py
      - .github/workflows/build-exact-scholarship-context.yml
permissions:
  contents: write
jobs:
  test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/apply_exact_scholarship_context.py
      - run: |
          python -m py_compile app.py scholarship_payment_context.py
          python -m unittest discover -s tests -p 'test_exact_scholarship_payment_context.py' -v
          python -m unittest discover -s tests -p 'test_scholarship_eligibility_workflow.py' -v
          git diff --check
      - name: Save validated app source patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          if ! git diff --cached --quiet; then
            git commit -m 'Resolve verified one-off eligibility service in AI ledger context'
            git push origin HEAD:fix/eligibility-verified-context-20261111
          fi
