name: V140 single authorized live IBROWS test enquiry
on:
  push:
    branches: [feature/v140-safe-e2e-readiness-20261010]
    paths: ['tools/run_v140_internal_e2e_once.py','.github/workflows/v140-live-e2e-once.yml']
permissions:
  contents: read
jobs:
  single-qa-enquiry:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Submit exactly one labeled official-site IBROWS test enquiry
        run: python tools/run_v140_internal_e2e_once.py
