name: Build verified V136 staff image and team roster
on:
  push:
    branches: [feature/v136-fatuma-nyirenda-team]
    paths:
      - 'tools/apply_v136.py'
      - 'tools/assets/fatuma-webp-256.b64'
      - '.github/workflows/v136-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder
        run: python -m pip install 'Pillow>=10.4,<13'
      - name: Generate and verify V136 source and portrait
        run: python tools/apply_v136.py
      - name: Commit only app.py
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          if git diff --cached --quiet; then
            echo 'Staff update already generated'
            exit 0
          fi
          git commit -m 'Add Fatuma Nyirenda as IT Specialist Lead with original portrait'
          git push origin HEAD:feature/v136-fatuma-nyirenda-team
