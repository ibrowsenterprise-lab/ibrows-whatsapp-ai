name: Inspect verified-payment receipt workflow
on:
  push:
    branches: [audit/receipt-workflow-20261111]
    paths: [tools/audit_receipts.py,.github/workflows/audit-receipts.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/audit_receipts.py
