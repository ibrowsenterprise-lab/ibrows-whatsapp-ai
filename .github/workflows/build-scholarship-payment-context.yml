name: Validate scholarship payment facts sent to AI
on:
  push:
    branches: [fix/scholarship-verified-payment-context-20261110]
    paths:
      - tools/apply_scholarship_ai_payment.py
      - tests/test_scholarship_payment_context.py
      - scholarship_payment_context.py
      - .github/workflows/build-scholarship-payment-context.yml
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/apply_scholarship_ai_payment.py
      - run: |
          python -m py_compile app.py scholarship_payment_context.py
          python -m unittest discover -s tests -p 'test_scholarship_payment_context.py' -v
          python -m unittest discover -s tests -p 'test_customer_resume.py' -v
          git diff --check
          git diff --stat
      - name: Commit verified application patch to review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          if ! git diff --cached --quiet; then
            git commit -m 'Expose verified scholarship package payment to WhatsApp AI'
            git push origin HEAD:fix/scholarship-verified-payment-context-20261110
          fi
