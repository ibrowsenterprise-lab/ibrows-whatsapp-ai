name: Audit human takeover notification path
on:
  push:
    branches: [audit/service-identity-readonly-20261111]
    paths: [tools/audit_handover_notifications.py,.github/workflows/audit-handover-notifications.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/audit_handover_notifications.py
