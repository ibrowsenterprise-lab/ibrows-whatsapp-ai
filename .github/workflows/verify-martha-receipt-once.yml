name: Verify one-time legacy receipt delivery authorization
on:
  push:
    branches: [ops/martha-verified-receipt-once-20261111]
    paths:
      - ops_martha_receipt_once.py
      - gunicorn.conf.py
      - tests/test_ops_martha_receipt_once.py
      - tests/test_launch_contact.py
      - .github/workflows/verify-martha-receipt-once.yml
permissions: {contents: read}
jobs:
  exact-payment:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install "Flask>=3,<4"
      - run: python -m py_compile ops_martha_receipt_once.py gunicorn.conf.py automatic_verified_receipts.py
      - run: python -m unittest discover -s tests -p 'test_ops_martha_receipt_once.py' -v
      - run: python -m unittest discover -s tests -p 'test_automatic_verified_receipts.py' -v
      - run: python -m unittest discover -s tests -p 'test_launch_contact.py' -v
      - run: git diff --check
